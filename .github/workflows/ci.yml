name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Show tool versions
        run: |
          zig version
          clang --version | head -n 1
          ar --version | head -n 1

      - name: Check formatting
        run: zig fmt --check build.zig compiler build-system

      - name: Build toolchain
        run: zig build

      - name: Run unit and regression tests
        run: zig build test

      - name: Run integration tests
        # A failing case is reported as an annotation, so the reason is visible on
        # the pull request even when the job log is not retrievable.
        run: |
          set +e
          output=$(zig build integration 2>&1)
          status=$?
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output" | grep -E '^  FAIL|^passed:|^error' | head -n 20 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            # The failing fixture's own diagnostics land on the lines after the
            # `FAIL`, which is where a compile or link error states its reason.
            # A failing case prints its reason indented under `FAIL`, so those
            # lines are the ones worth surfacing.
            printf '%s\n' "$output" | grep -E '^       ' | tail -n 30 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          exit "$status"

      - name: Build optimized toolchain
        run: zig build -Doptimize=ReleaseSafe
